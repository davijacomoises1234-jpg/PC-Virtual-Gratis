name: Windows Virtual PC

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest

    steps:
      - name: Informações do Windows
        shell: powershell
        run: |
          Write-Host "=== WINDOWS VIRTUAL PC ==="
          Write-Host ""
          Write-Host "Usuário:"
          whoami
          Write-Host ""
          Write-Host "Sistema:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture
          Write-Host ""
          Write-Host "Processador:"
          Get-CimInstance Win32_Processor |
            Select-Object -First 1 Name
          Write-Host ""
          Write-Host "Memória:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{Name="RAM_GB";Expression={[math]::Round($_.TotalPhysicalMemory / 1GB, 2)}}

      - name: Testar a máquina
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\Desktop\Teste" | Out-Null

          "PC virtual iniciado com sucesso!" |
            Out-File "$env:USERPROFILE\Desktop\Teste\teste.txt"

          Write-Host ""
          Write-Host "Máquina Windows funcionando!"
          Write-Host "Arquivo criado em:"
          Write-Host "$env:USERPROFILE\Desktop\Teste\teste.txt"
